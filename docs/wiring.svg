<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1160" width="1400" height="1160" font-family="Segoe UI, Arial, sans-serif">
  <!-- Pin map matches src/panel_io.cpp. Red = 5 V, black = GND, colors = signals. -->
  <rect width="1400" height="1160" fill="#ffffff"/>
  <text x="30" y="42" font-size="26" font-weight="700" fill="#1b1f24">Nuclear Reactor Simulator — Wiring Plan</text>
  <text x="30" y="68" font-size="14" fill="#5b6470">Arduino UNO R4 Minima · pins match src/panel_io.cpp</text>

  <!-- Power rails (breadboard style), joined along the bottom -->
  <path d="M60 170 V880 H1340 V170" fill="none" stroke="#d62728" stroke-width="4"/>
  <path d="M90 170 V850 H1310 V170" fill="none" stroke="#222" stroke-width="4"/>
  <text x="58" y="160" font-size="13" font-weight="700" fill="#d62728" text-anchor="middle">5V</text>
  <text x="92" y="160" font-size="13" font-weight="700" fill="#222" text-anchor="middle">GND</text>
  <text x="1308" y="160" font-size="13" font-weight="700" fill="#222" text-anchor="middle">GND</text>
  <text x="1342" y="160" font-size="13" font-weight="700" fill="#d62728" text-anchor="middle">5V</text>
  <text x="700" y="906" font-size="12" fill="#5b6470" text-anchor="middle">Breadboard rails: red = 5 V from the Arduino, black = GND. Every GND is joined, including the servo pack's −.</text>

  <!-- Arduino board -->
  <rect x="520" y="200" width="360" height="520" rx="14" fill="#00878f" stroke="#005f66" stroke-width="3"/>
  <rect x="815" y="188" width="50" height="26" rx="6" fill="#c8c8c8" stroke="#666"/>
  <text x="840" y="232" font-size="11" fill="#fff" text-anchor="middle">USB-C</text>
  <text x="840" y="246" font-size="10" fill="#d8f3f5" text-anchor="middle">to laptop</text>
  <text x="700" y="440" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">Arduino</text>
  <text x="700" y="470" font-size="20" fill="#fff" text-anchor="middle">UNO R4 Minima</text>
  <text x="700" y="498" font-size="13" fill="#d8f3f5" text-anchor="middle">runs the reactor physics</text>
  <text x="700" y="516" font-size="13" fill="#d8f3f5" text-anchor="middle">every 10 ms</text>

  <!-- Board pins -->
  <g fill="#222">
    <rect x="513" y="288" width="14" height="14"/><rect x="513" y="408" width="14" height="14"/>
    <rect x="513" y="528" width="14" height="14"/><rect x="513" y="628" width="14" height="14"/>
    <rect x="873" y="273" width="14" height="14"/><rect x="873" y="353" width="14" height="14"/>
    <rect x="873" y="408" width="14" height="14"/><rect x="873" y="463" width="14" height="14"/>
    <rect x="873" y="518" width="14" height="14"/><rect x="873" y="633" width="14" height="14"/>
    <rect x="723" y="193" width="14" height="14"/><rect x="783" y="193" width="14" height="14"/>
    <rect x="633" y="713" width="14" height="14"/><rect x="753" y="713" width="14" height="14"/>
  </g>
  <g font-size="14" font-weight="700" fill="#fff">
    <text x="535" y="300">A0</text><text x="535" y="420">A1</text>
    <text x="535" y="540">D2</text><text x="535" y="640">D3</text>
    <text x="865" y="285" text-anchor="end">D4</text><text x="865" y="365" text-anchor="end">D5</text>
    <text x="865" y="420" text-anchor="end">D6</text><text x="865" y="475" text-anchor="end">D7</text>
    <text x="865" y="530" text-anchor="end">D12</text><text x="865" y="645" text-anchor="end">D9</text>
    <text x="730" y="226" text-anchor="middle">SCL</text><text x="790" y="226" text-anchor="middle">SDA</text>
    <text x="640" y="705" text-anchor="middle">5V</text><text x="760" y="705" text-anchor="middle">GND</text>
  </g>
  <g font-size="10" fill="#d8f3f5" text-anchor="middle">
    <text x="730" y="240">(A5)</text><text x="790" y="240">(A4)</text>
  </g>

  <!-- Board power pins to rails (5V hops over the GND line) -->
  <path d="M640 727 V843 A7 7 0 0 1 640 857 V880" fill="none" stroke="#d62728" stroke-width="3"/>
  <path d="M760 727 V850" fill="none" stroke="#222" stroke-width="3"/>
  <circle cx="640" cy="880" r="5" fill="#d62728"/><circle cx="760" cy="850" r="5" fill="#222"/>

  <!-- OLED -->
  <rect x="560" y="60" width="280" height="90" rx="8" fill="#1a1a2e" stroke="#444" stroke-width="2"/>
  <rect x="600" y="70" width="200" height="54" rx="3" fill="#06122b"/>
  <text x="700" y="92" font-size="12" font-family="Consolas, monospace" fill="#8fd3ff" text-anchor="middle">P 100.0%  T 320.0K</text>
  <text x="700" y="112" font-size="12" font-family="Consolas, monospace" fill="#8fd3ff" text-anchor="middle">ROD 50%   NORMAL</text>
  <g font-size="10" fill="#fff" text-anchor="middle">
    <text x="590" y="142">GND</text><text x="650" y="142">VCC</text><text x="730" y="142">SCL</text><text x="790" y="142">SDA</text>
  </g>
  <text x="850" y="88" font-size="14" font-weight="700" fill="#1b1f24">OLED screen 0.96" (SSD1306)</text>
  <text x="850" y="106" font-size="12" fill="#5b6470">I²C address 0x3C · VCC works on 3.3–5 V</text>
  <path d="M730 150 V193" stroke="#2ca02c" stroke-width="3"/>
  <path d="M790 150 V193" stroke="#2ca02c" stroke-width="3"/>
  <path d="M590 150 V175 H90" fill="none" stroke="#222" stroke-width="3"/>
  <path d="M650 150 V185 H97 A7 7 0 0 0 83 185 H60" fill="none" stroke="#d62728" stroke-width="3"/>
  <circle cx="90" cy="175" r="5" fill="#222"/><circle cx="60" cy="185" r="5" fill="#d62728"/>

  <!-- Control-rod pot (A0) -->
  <rect x="150" y="255" width="220" height="80" rx="10" fill="#fff7e6" stroke="#e0a030" stroke-width="2"/>
  <circle cx="190" cy="295" r="18" fill="#555"/><line x1="190" y1="295" x2="190" y2="279" stroke="#fff" stroke-width="3"/>
  <text x="218" y="290" font-size="14" font-weight="700" fill="#1b1f24">Control-rod knob</text>
  <text x="218" y="308" font-size="11" fill="#5b6470">10 kΩ pot · rod 0–100 %</text>
  <path d="M150 275 H97 A7 7 0 0 0 83 275 H60" fill="none" stroke="#d62728" stroke-width="3"/>
  <path d="M150 315 H90" stroke="#222" stroke-width="3"/>
  <path d="M370 295 H513" stroke="#ff7f0e" stroke-width="3"/>
  <circle cx="60" cy="275" r="5" fill="#d62728"/><circle cx="90" cy="315" r="5" fill="#222"/>
  <text x="122" y="268" font-size="10" fill="#5b6470" text-anchor="middle">outer leg</text>
  <text x="122" y="330" font-size="10" fill="#5b6470" text-anchor="middle">outer leg</text>
  <text x="442" y="287" font-size="11" fill="#b35a00" text-anchor="middle">middle leg (wiper)</text>

  <!-- Coolant pot (A1) -->
  <rect x="150" y="375" width="220" height="80" rx="10" fill="#fff7e6" stroke="#e0a030" stroke-width="2"/>
  <circle cx="190" cy="415" r="18" fill="#555"/><line x1="190" y1="415" x2="190" y2="399" stroke="#fff" stroke-width="3"/>
  <text x="218" y="410" font-size="14" font-weight="700" fill="#1b1f24">Coolant-temp knob</text>
  <text x="218" y="428" font-size="11" fill="#5b6470">10 kΩ pot · 280–300 K</text>
  <path d="M150 395 H97 A7 7 0 0 0 83 395 H60" fill="none" stroke="#d62728" stroke-width="3"/>
  <path d="M150 435 H90" stroke="#222" stroke-width="3"/>
  <path d="M370 415 H513" stroke="#ff7f0e" stroke-width="3"/>
  <circle cx="60" cy="395" r="5" fill="#d62728"/><circle cx="90" cy="435" r="5" fill="#222"/>
  <text x="442" y="407" font-size="11" fill="#b35a00" text-anchor="middle">middle leg (wiper)</text>

  <!-- SCRAM button (D2) -->
  <rect x="150" y="500" width="220" height="70" rx="10" fill="#ffecec" stroke="#d62728" stroke-width="2"/>
  <circle cx="190" cy="535" r="16" fill="#d62728" stroke="#7a1010" stroke-width="2"/>
  <text x="218" y="530" font-size="14" font-weight="700" fill="#1b1f24">SCRAM button</text>
  <text x="218" y="548" font-size="11" fill="#5b6470">emergency stop</text>
  <path d="M150 535 H90" stroke="#222" stroke-width="3"/>
  <path d="M370 535 H513" stroke="#1f77b4" stroke-width="3"/>
  <circle cx="90" cy="535" r="5" fill="#222"/>
  <text x="442" y="527" font-size="11" fill="#1f5f99" text-anchor="middle">press = pin to GND</text>

  <!-- Reset button (D3) -->
  <rect x="150" y="600" width="220" height="70" rx="10" fill="#eef5ff" stroke="#1f77b4" stroke-width="2"/>
  <circle cx="190" cy="635" r="16" fill="#1f77b4" stroke="#0d3d66" stroke-width="2"/>
  <text x="218" y="630" font-size="14" font-weight="700" fill="#1b1f24">Reset button</text>
  <text x="218" y="648" font-size="11" fill="#5b6470">clears a trip (rods in)</text>
  <path d="M150 635 H90" stroke="#222" stroke-width="3"/>
  <path d="M370 635 H513" stroke="#1f77b4" stroke-width="3"/>
  <circle cx="90" cy="635" r="5" fill="#222"/>
  <text x="442" y="627" font-size="11" fill="#1f5f99" text-anchor="middle">press = pin to GND</text>

  <!-- Legend -->
  <rect x="130" y="700" width="360" height="130" rx="8" fill="#fafafa" stroke="#ccc"/>
  <text x="145" y="722" font-size="13" font-weight="700" fill="#1b1f24">Legend</text>
  <g font-size="11" fill="#1b1f24">
    <line x1="145" y1="742" x2="175" y2="742" stroke="#d62728" stroke-width="3"/><text x="182" y="746">5 V power</text>
    <line x1="145" y1="762" x2="175" y2="762" stroke="#222" stroke-width="3"/><text x="182" y="766">Ground (GND)</text>
    <line x1="145" y1="782" x2="175" y2="782" stroke="#ff7f0e" stroke-width="3"/><text x="182" y="786">analog / servo signal</text>
    <line x1="145" y1="802" x2="175" y2="802" stroke="#1f77b4" stroke-width="3"/><text x="182" y="806">button input</text>
    <line x1="315" y1="742" x2="345" y2="742" stroke="#9467bd" stroke-width="3"/><text x="352" y="746">output (LED, buzzer)</text>
    <line x1="315" y1="762" x2="345" y2="762" stroke="#2ca02c" stroke-width="3"/><text x="352" y="766">I²C data (screen)</text>
    <circle cx="330" cy="782" r="5" fill="#222"/><text x="352" y="786">dot = wires joined</text>
    <path d="M315 802 H323 A7 7 0 0 1 337 802 H345" fill="none" stroke="#222" stroke-width="2"/><text x="352" y="806">hop = crosses, not joined</text>
  </g>

  <!-- Buzzer driver (D4): pin → 1 kΩ → NPN; buzzer between 5V and collector -->
  <path d="M887 280 H940" stroke="#9467bd" stroke-width="3"/>
  <path d="M940 280 l5 -8 l10 16 l10 -16 l10 16 l10 -16 l10 16 l5 -8" fill="none" stroke="#333" stroke-width="2"/>
  <text x="970" y="264" font-size="11" fill="#333" text-anchor="middle">1 kΩ</text>
  <path d="M1000 280 H1040" stroke="#9467bd" stroke-width="3"/>
  <circle cx="1052" cy="280" r="22" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="1040" y1="266" x2="1040" y2="294" stroke="#333" stroke-width="3"/>
  <path d="M1040 272 L1060 260 V225" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M1040 288 L1060 300 V310 H1310" fill="none" stroke="#222" stroke-width="2.5"/>
  <polygon points="1060,300 1049,299 1054,291" fill="#333"/>
  <circle cx="1310" cy="310" r="5" fill="#222"/>
  <text x="1086" y="278" font-size="12" font-weight="700" fill="#1b1f24">NPN transistor 2N2222</text>
  <text x="1086" y="294" font-size="10" fill="#5b6470">check datasheet for E-B-C leg order</text>
  <rect x="1020" y="175" width="180" height="50" rx="8" fill="#f3e8ff" stroke="#9467bd" stroke-width="2"/>
  <text x="1110" y="197" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="middle">Active buzzer (5 V)</text>
  <text x="1110" y="214" font-size="10" fill="#5b6470" text-anchor="middle">+ to 5V · − to transistor</text>
  <text x="1068" y="240" font-size="12" font-weight="700" fill="#333">−</text>
  <path d="M1200 195 H1303 A7 7 0 0 1 1317 195 H1340" fill="none" stroke="#d62728" stroke-width="3"/>
  <circle cx="1340" cy="195" r="5" fill="#d62728"/>
  <text x="1210" y="188" font-size="12" font-weight="700" fill="#d62728">+</text>

  <!-- LEDs: pin → 470 Ω → LED → GND -->
  <g id="leds">
    <path d="M887 360 H950" stroke="#9467bd" stroke-width="3"/>
    <path d="M950 360 l5 -7 l10 14 l10 -14 l10 14 l10 -14 l10 14 l5 -7" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M1010 360 H1060" stroke="#9467bd" stroke-width="3"/>
    <polygon points="1060,349 1060,371 1082,360" fill="#2ca02c" stroke="#333"/>
    <line x1="1082" y1="349" x2="1082" y2="371" stroke="#333" stroke-width="3"/>
    <path d="M1082 360 H1310" stroke="#222" stroke-width="2.5"/><circle cx="1310" cy="360" r="5" fill="#222"/>
    <text x="980" y="346" font-size="11" fill="#333" text-anchor="middle">470 Ω</text>
    <text x="1100" y="352" font-size="12" fill="#1b1f24"><tspan font-weight="700">Green LED</tspan> — normal</text>
    <text x="1060" y="386" font-size="9" fill="#5b6470">long leg (+) faces the resistor</text>

    <path d="M887 415 H950" stroke="#9467bd" stroke-width="3"/>
    <path d="M950 415 l5 -7 l10 14 l10 -14 l10 14 l10 -14 l10 14 l5 -7" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M1010 415 H1060" stroke="#9467bd" stroke-width="3"/>
    <polygon points="1060,404 1060,426 1082,415" fill="#f2c200" stroke="#333"/>
    <line x1="1082" y1="404" x2="1082" y2="426" stroke="#333" stroke-width="3"/>
    <path d="M1082 415 H1310" stroke="#222" stroke-width="2.5"/><circle cx="1310" cy="415" r="5" fill="#222"/>
    <text x="980" y="401" font-size="11" fill="#333" text-anchor="middle">470 Ω</text>
    <text x="1100" y="407" font-size="12" fill="#1b1f24"><tspan font-weight="700">Yellow LED</tspan> — warning</text>

    <path d="M887 470 H950" stroke="#9467bd" stroke-width="3"/>
    <path d="M950 470 l5 -7 l10 14 l10 -14 l10 14 l10 -14 l10 14 l5 -7" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M1010 470 H1060" stroke="#9467bd" stroke-width="3"/>
    <polygon points="1060,459 1060,481 1082,470" fill="#d62728" stroke="#333"/>
    <line x1="1082" y1="459" x2="1082" y2="481" stroke="#333" stroke-width="3"/>
    <path d="M1082 470 H1310" stroke="#222" stroke-width="2.5"/><circle cx="1310" cy="470" r="5" fill="#222"/>
    <text x="980" y="456" font-size="11" fill="#333" text-anchor="middle">470 Ω</text>
    <text x="1100" y="462" font-size="12" fill="#1b1f24"><tspan font-weight="700">Red LED</tspan> — tripped</text>

    <path d="M887 525 H950" stroke="#9467bd" stroke-width="3"/>
    <path d="M950 525 l5 -7 l10 14 l10 -14 l10 14 l10 -14 l10 14 l5 -7" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M1010 525 H1060" stroke="#9467bd" stroke-width="3"/>
    <polygon points="1060,514 1060,536 1082,525" fill="#1f77b4" stroke="#333"/>
    <line x1="1082" y1="514" x2="1082" y2="536" stroke="#333" stroke-width="3"/>
    <path d="M1082 525 H1310" stroke="#222" stroke-width="2.5"/><circle cx="1310" cy="525" r="5" fill="#222"/>
    <text x="980" y="511" font-size="11" fill="#333" text-anchor="middle">470 Ω</text>
    <text x="1100" y="517" font-size="12" fill="#1b1f24"><tspan font-weight="700">Blue LED</tspan> — critical (steady)</text>
  </g>

  <!-- Servo (D9) and its own supply -->
  <path d="M887 640 H1040" stroke="#ff7f0e" stroke-width="3"/>
  <text x="962" y="632" font-size="11" fill="#b35a00" text-anchor="middle">signal (orange wire)</text>
  <rect x="1040" y="600" width="200" height="100" rx="10" fill="#eef7ee" stroke="#2f7d32" stroke-width="2"/>
  <text x="1058" y="628" font-size="14" font-weight="700" fill="#1b1f24">SG90 servo</text>
  <text x="1058" y="646" font-size="11" fill="#5b6470">needle shows rod position</text>
  <text x="1058" y="662" font-size="11" fill="#5b6470">0° = rods fully in</text>
  <circle cx="1200" cy="626" r="11" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="1196" y="602" width="8" height="24" rx="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <path d="M1240 670 H1310" stroke="#222" stroke-width="3"/><circle cx="1310" cy="670" r="5" fill="#222"/>
  <text x="1275" y="662" font-size="10" fill="#333" text-anchor="middle">GND (brown)</text>
  <path d="M1100 700 V760" stroke="#d62728" stroke-width="3"/>
  <text x="1108" y="734" font-size="10" fill="#d62728">V+ (red wire)</text>
  <rect x="1040" y="760" width="200" height="70" rx="8" fill="#fff0f0" stroke="#d62728" stroke-width="2"/>
  <text x="1140" y="782" font-size="13" font-weight="700" fill="#1b1f24" text-anchor="middle">Servo power 5–6 V</text>
  <text x="1140" y="799" font-size="10" fill="#5b6470" text-anchor="middle">4×AA pack or 5 V USB supply</text>
  <text x="1140" y="815" font-size="10" font-weight="700" fill="#d62728" text-anchor="middle">not the Arduino 5V pin</text>
  <path d="M1240 810 H1310" stroke="#222" stroke-width="3"/><circle cx="1310" cy="810" r="5" fill="#222"/>
  <text x="1252" y="804" font-size="12" font-weight="700" fill="#333">−</text>

  <!-- Parts list -->
  <rect x="30" y="925" width="1340" height="220" rx="10" fill="#f7f9fc" stroke="#cfd8e3"/>
  <text x="50" y="952" font-size="16" font-weight="700" fill="#1b1f24">Parts to order</text>
  <g font-size="12.5" fill="#1b1f24">
    <text x="50" y="978">1. Arduino UNO R4 Minima (ABX00080) + USB-C data cable — 1</text>
    <text x="50" y="998">2. 0.96" SSD1306 OLED, I²C, 4 pins (GND VCC SCL SDA) — 1</text>
    <text x="50" y="1018">3. 10 kΩ linear potentiometer (B10K) with knob — 2</text>
    <text x="50" y="1038">4. Push buttons (12 mm tactile; a big red one for SCRAM is fun) — 2</text>
    <text x="50" y="1058">5. 5 mm LEDs: green, yellow, red, blue — 1 each</text>
    <text x="50" y="1078">6. Resistors: 470 Ω × 4, 1 kΩ × 1</text>
    <text x="710" y="978">7. Active buzzer, 5 V (longer leg = +) — 1</text>
    <text x="710" y="998">8. NPN transistor 2N2222 or PN2222A — 1</text>
    <text x="710" y="1018">9. SG90 micro servo — 1</text>
    <text x="710" y="1038">10. 4×AA battery holder or 5 V USB breakout (servo power) — 1</text>
    <text x="710" y="1058">11. Full-size breadboard + male-to-male jumper wires — 1 kit</text>
    <text x="710" y="1078" fill="#5b6470">An Arduino starter kit usually covers items 3–9 and 11.</text>
  </g>
  <text x="50" y="1110" font-size="12" fill="#b3261e"><tspan font-weight="700">Rules: </tspan>R4 pins supply at most 8 mA, so the buzzer goes through the transistor and LED resistors stay ≥ 470 Ω. Give the servo its own supply and join its − to GND.</text>
  <text x="50" y="1130" font-size="12" fill="#5b6470">If a knob works backwards, swap its two outer legs. Wire with the USB unplugged.</text>
</svg>
