; Arduino UNO R4 firmware (Minima or WiFi). The physics library in lib/reactor is found
; automatically. Desktop tests use CMake instead (see README).
[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    arduino-libraries/Servo
; Warnings for our sources only; the Arduino core is not warning-clean.
build_src_flags = -Wall -Wextra -Wdouble-promotion -Wfloat-conversion -Wshadow

; ELEGOO R4 WiFi kit board; same RA4M1 MCU, so the firmware is unchanged.
[env:uno_r4_wifi]
extends = env:uno_r4_minima
board = uno_r4_wifi
